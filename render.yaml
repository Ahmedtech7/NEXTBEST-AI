services:
  - type: web
    name: nextbest-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.train
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
